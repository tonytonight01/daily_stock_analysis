# Prebuilt Web workspace for NAS; seed ./data/runtime.env before starting.
name: daily-stock-analysis-nas

services:
  server:
    image: ${DSA_NAS_IMAGE:-ghcr.io/zhulinsen/daily_stock_analysis:latest}
    restart: unless-stopped
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    ports:
      - "${NAS_BIND_HOST:-0.0.0.0}:${NAS_WEB_PORT:-8000}:${API_PORT:-8000}"
    environment:
      TZ: Asia/Shanghai
      ENV_FILE: /app/data/runtime.env
      WEBUI_HOST: 0.0.0.0
      WEBUI_PORT: ${API_PORT:-8000}
      WEBUI_AUTO_BUILD: "false"
      ADMIN_AUTH_ENABLED: "true"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['WEBUI_PORT'] + '/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
